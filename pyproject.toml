[project]
name = "dinamica-molecular"
version = "0.1.0"
description = "IC PIBIC/CNPq — aprendizado de máquina aplicado à análise de simulações de dinâmica molecular"
requires-python = ">=3.12"

dependencies = [
    # análise de trajetória
    "mdanalysis>=2.7",
    "nglview>=3.1",
    # aprendizado de máquina e dados
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    # visualização
    "matplotlib>=3.8",
    # ambiente de trabalho
    "jupyterlab>=4.0",
    "ipywidgets>=8.1",
    "pytest>=8.0",
]

# A simulação em OpenMM (Fase D) não entra aqui: o OpenMM é distribuído por
# conda-forge, não por PyPI. Quando chegar a hora, ver environment.yml.

[tool.pytest.ini_options]
testpaths = ["tests"]
